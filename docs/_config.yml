title: "Diffusing Scaled Text Embeddings"
description: "Scaling and distilling text embeddings for continuous diffusion language models."
url: "https://la0ka1.github.io"
baseurl: "/diffusing-scaled-text-embeddings"
repository: "la0ka1/diffusing-scaled-text-embeddings"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"   # try: "air", "dark", "mint", "sunrise"

plugins:
  - jekyll-include-cache

# local preview files, not part of the published page
# (GitHub Pages runs Jekyll 3, where this list replaces the default one, so the Gemfile is named too)
exclude:
  - Dockerfile
  - compose.yaml
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  input: GFM

author:
  name: "Zekai Zhang"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      classes: wide
      toc: false
      toc_sticky: false
